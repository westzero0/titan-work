<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전점검 보고서</title>
<link rel="stylesheet" href="pc.css">
<style>
  body { margin: 0; padding: 28px 40px 56px; }
  .wrap { max-width: 1280px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 18px; flex-wrap: wrap; }
  .tabs button { min-height: 38px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--text-sub); font-size: 15px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
  .bar .sp { flex: 1; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 0 0 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
  .kpi .lb { color: var(--text-sub); font-size: 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--text-sub); margin-left: 4px; }
  h3.sec { margin: 22px 0 10px; font-size: 17px; }
  .prog { width: 140px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .prog b { display: block; height: 100%; background: var(--ok); }
  .st { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--line); color: var(--text-sub); white-space: nowrap; }
  .st.s3 { background: var(--ok-soft); color: var(--ok); }
  .st.s2 { background: var(--accent-soft); color: var(--accent); }
  .st.s1 { background: var(--warn-soft); color: var(--warn); }
  .st.s4 { background: var(--danger-soft); color: var(--danger); }
  .two { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
  .slist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: 70vh; overflow: auto; }
  .slist label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .slist label:last-child { border-bottom: 0; }
  .slist input { min-height: 0; width: 18px; height: 18px; }
  .slist .nm { flex: 1; font-weight: 600; }
  .slist .cn { color: var(--text-sub); font-size: 14px; }
  .prev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; overflow: auto; }
  #printArea { display: none; }
  .pcap { font-size: 13.5px; color: var(--text-sub); margin: 0 0 6px; }
  .pthumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .pthumbs button { width: 112px; height: 112px; padding: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); cursor: pointer; }
  .pthumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #pv { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.9); display: flex; flex-direction: column; }
  #pv[hidden] { display: none; }
  #pv .pvh { display: flex; gap: 10px; align-items: center; padding: 10px 18px; color: #fff; flex-wrap: wrap; }
  #pv .pvh .sp { flex: 1; }
  #pv .pvb { flex: 1; overflow: auto; display: flex; }
  #pv .pvb img { max-width: 100%; max-height: 100%; margin: auto; display: block; }
  #pv.full .pvb img { max-width: none; max-height: none; margin: 0; }
  #pv .pvw { color: #fff; margin: auto; }
  @media print { #pv { display: none !important; } }

  /* ---- 종이(결선도, 보고서) 모양: 화면 미리보기와 인쇄가 같은 모양 ---- */
  /* 표·결선도 기본 모양은 safety-core.js(paperCss)에서 넣는다. 여기는 보고서에만 있는 것 */
  .paper .sub { text-align: right; margin: 0 0 3mm; font-size: 9pt; color: #333; }
  .paper .wrapcell { white-space: normal; text-align: left; }
  .paper .pgbreak { page-break-after: always; }
  .paper .pgbreak:last-child { page-break-after: auto; }
  .paper .kp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3mm; margin: 0 0 4mm; }
  .paper .kp div { border: 1px solid #000; padding: 2mm; text-align: center; }
  .paper .kp b { display: block; font-size: 14pt; }
  .paper h2 { margin: 4mm 0 2mm; font-size: 11pt; }

  @page land { size: A4 landscape; margin: 10mm; }
  @page port { size: A4 portrait; margin: 10mm; }
  .land { page: land; }
  .port { page: port; }
  @media print {
    html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
    #app { display: none !important; }
    #printArea { display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 900px) { body { padding: 18px 14px 40px; } .kpis { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
  /* ---- 폰 앱(점검표 + 노선)과 같은 모양: 남색 한 가지, 각진 모서리, 상자 대신 줄. 이 화면 안에서만 바꾼다(pc.css는 다른 허브 화면과 같이 쓴다) ---- */
  :root { --accent: #1E4272; --accent-soft: #E6ECF4; --r: 4px; }
  body { background: #F3F4F0; }
  .page-head h2 { letter-spacing: -.02em; }
  .tabs { gap: 0; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; display: inline-flex; margin: 0 0 18px; }
  .tabs button { border: 0; border-right: 1px solid var(--line-strong); border-radius: 0; min-height: 40px; }
  .tabs button:last-child { border-right: 0; }
  .kpis { gap: 0; border-top: 2px solid var(--text); margin: 0 0 24px; }
  .kpi { background: none; border: 0; border-right: 1px solid var(--line-strong); border-radius: 0; padding: 12px 16px; }
  .kpi:last-child { border-right: 0; }
  .kpi .v { font-family: ui-monospace, 'IBM Plex Mono', Consolas, monospace; }
  h3.sec { padding-top: 0; }
  table.tbl { border: 0; border-top: 2px solid var(--text); border-radius: 0; background: none; }
  .tbl th { background: none; color: var(--text); border-bottom: 1px solid var(--text); }
  .tbl td { border-bottom: 1px solid var(--line-strong); }
  .tbl tbody tr:hover td { background: rgba(30, 66, 114, .05); }
  .prog { border-radius: 0; }
  .prog b { background: var(--accent); }
  .st { background: none; padding: 0; border-radius: 0; font-size: 14px; font-weight: 600; color: var(--text-sub); }
  .st.s2 { background: none; color: var(--text); font-weight: 700; }
  .st.s1 { background: none; color: var(--text-sub); }
  .st.s4 { background: none; color: var(--text-sub); text-decoration: line-through; }
  .stamp { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: inset 0 0 0 2px #F3F4F0, inset 0 0 0 3.5px var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; line-height: 1.15; text-align: center; transform: rotate(-12deg); opacity: .9; vertical-align: middle; }
  .slist { border: 0; border-top: 2px solid var(--text); border-radius: 0; background: none; }
  .slist label { border-bottom: 1px solid var(--line-strong); }
  .prev { border: 0; border-top: 2px solid var(--text); border-radius: 0; background: none; padding: 14px 0; }
  .prev .paper { background: #fff; border: 1px solid var(--line-strong); padding: 10mm; }
  .pthumbs button { border-radius: 4px; }
  #pv .pvh .btn { border-radius: 4px; }
  input[type=checkbox] { accent-color: var(--accent); }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="page-head">
    <div><h2>안전점검 보고서</h2><p id="meta">불러오는 중…</p></div>
    <div class="bar" style="margin:0">
      <button class="btn" id="reload" type="button">새로 불러오기</button>
      <button class="btn" id="csv" type="button">표 내려받기 (CSV)</button>
      <button class="btn btn-primary" id="print" type="button">인쇄</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="보고서 종류">
    <button type="button" data-t="status" aria-pressed="true">점검 현황</button>
    <button type="button" data-t="sheet" aria-pressed="false">분전반 결선도</button>
    <button type="button" data-t="route" aria-pressed="false">동선 일정</button>
  </div>
  <div id="view"><div class="msg">불러오는 중…</div></div>
</div>
<div id="pv" role="dialog" aria-modal="true" aria-label="현장 사진" hidden></div>
<div id="printArea" class="paper" aria-hidden="true"></div>

<script src="common.js"></script>
<script src="safety-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = SafetyCore.esc;
{ const st = document.createElement('style'); st.textContent = SafetyCore.paperCss('.paper'); document.head.appendChild(st); } // 폰 인쇄와 같은 종이 모양
const STATUS = ['미정', '점포협의', '일정확정', '점검완료', '점검취소'];
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const STAMP = '<span class="stamp" role="img" aria-label="점검완료">점검<br>완료</span>';
const LS_SHARED = 'safety-cache-v1';       // 안전점검 앱이 폰/PC에 보관한 데이터 (읽기만 한다)
const LS_OWN = 'safety-report-cache-v1';   // 이 화면이 마지막으로 받은 데이터

let D = { stores: {}, routes: {}, sheets: {}, config: {}, photos: {} };
let loadedAt = 0, tab = 'status';
const F = { group: '', status: '', q: '' };   // 현황 필터
const picked = new Set();                      // 결선도 선택
let showEmpty = false, routeFrom = 'today';

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function who() { try { return localStorage.getItem('titan_user_name') || ''; } catch (e) { return ''; } }
function pad(n) { return SafetyCore.pad(n); }
function todayStr() { return SafetyCore.ymd(new Date()); }
function todayLabel() { const d = new Date(); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '(' + WD[d.getDay()] + ')'; }
function dlabel(ds) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ds || ''); if (!m) return ds || ''; const d = new Date(+m[1], +m[2] - 1, +m[3]); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
const region = SafetyCore.regionText;
function stores() { return Object.values(D.stores).sort((a, b) => (a.no || 0) - (b.no || 0)); }
function sheetOf(id) { return D.sheets[id] || { rows: [] }; }
function circuits(id) { return SafetyCore.circuits(sheetOf(id)); }
function stCls(s) { return 's' + Math.max(0, STATUS.indexOf(s)); }
function nextAssign(id) {
  const best = SafetyCore.nextRoute(Object.values(D.routes), id, todayStr());
  return best ? (best.owner || '담당 미정') + ' ' + dlabel(best.date) : '';
}
function groupsOf(list) { const seen = [], set = {}; list.forEach(s => { const g = s.group || '구간 없음'; if (!set[g]) { set[g] = 1; seen.push(g); } }); return seen; }

/* ---------- 불러오기: 보관 데이터를 먼저 보여주고, 서버(느림)는 뒤에서 ---------- */
function useCache() {
  const c = lsGet(LS_OWN) || lsGet(LS_SHARED);
  if (c && c.stores && Object.keys(c.stores).length) { D = { stores: c.stores || {}, routes: c.routes || {}, sheets: c.sheets || {}, config: c.config || {}, photos: c.photos || {} }; return true; }
  return false;
}
async function refresh() {
  $('reload').disabled = true;
  try {
    const r = await sendToGas('safetyList', {});
    if (!r || r.res !== 'SUCCESS' || !r.data) throw new Error((r && (r.message || r.msg)) || '응답 형식 오류');
    D = { stores: r.data.stores || {}, routes: r.data.routes || {}, sheets: r.data.sheets || {}, config: r.data.config || {}, photos: r.data.photos || {} };
    try { localStorage.setItem(LS_OWN, JSON.stringify(D)); } catch (e) {}
    loadedAt = Date.now(); render();
  } catch (e) {
    $('meta').innerHTML = '<span class="err">서버에서 불러오지 못했어요: ' + esc(e.message) + '</span>' + (Object.keys(D.stores).length ? ' (보관해 둔 데이터를 보여줘요)' : '');
  } finally { $('reload').disabled = false; }
}

/* ---------- 점검 현황 ---------- */
function statusRows() {
  return stores().filter(s => (!F.group || (s.group || '구간 없음') === F.group) && (!F.status || s.status === F.status) &&
    (!F.q || (s.name + ' ' + s.code + ' ' + s.address + ' ' + (s.memo || '')).toLowerCase().includes(F.q.toLowerCase())));
}
function summary(list) {
  const p = SafetyCore.progress(list);
  return { total: p.t, done: p.d, left: p.t - p.d, cancel: list.length - p.t, sheet: list.filter(s => circuits(s.id).length).length, pct: p.p };
}
function groupTable(list, plain) {
  const gs = groupsOf(list);
  let h = '<table class="' + (plain ? '' : 'tbl') + '"><thead><tr><th>구간</th><th class="n">점포</th><th class="n">완료</th><th class="n">남음</th><th class="n">취소</th><th>진행률</th></tr></thead><tbody>';
  gs.forEach(g => {
    const m = summary(list.filter(s => (s.group || '구간 없음') === g));
    h += '<tr><td' + (plain ? ' class="l"' : '') + '>' + esc(g) + '</td><td class="n">' + m.total + '</td><td class="n">' + m.done + '</td><td class="n">' + m.left + '</td><td class="n">' + m.cancel + '</td><td>' + (plain ? m.pct + '%' : '<span class="prog"><b style="width:' + m.pct + '%"></b></span> ' + m.pct + '%') + '</td></tr>';
  });
  return h + '</tbody></table>';
}
function storeTable(rows, plain) {
  let h = '<table class="' + (plain ? '' : 'tbl') + '"><thead><tr><th>No</th><th>점포명</th><th>구분</th><th>지역</th><th>구간</th><th>상태</th><th>예상 작업일</th><th>다음 담당</th><th class="n">결선도</th><th>메모</th></tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="10" class="empty">조건에 맞는 점포가 없습니다.</td></tr>';
  rows.forEach(s => {
    const c = circuits(s.id).length;
    h += '<tr><td>' + esc(s.no) + '</td><td' + (plain ? ' class="l"' : '') + '><b>' + esc(s.name) + '</b></td><td>' + esc(s.type) + '</td><td' + (plain ? ' class="l"' : '') + '>' + esc(region(s.address)) + '</td><td' + (plain ? ' class="l"' : '') + '>' + esc(s.group || '') + '</td><td>' + (plain ? esc(s.status) : (s.status === '점검완료' ? STAMP : '<span class="st ' + stCls(s.status) + '">' + esc(s.status) + '</span>')) + '</td><td' + (plain ? ' class="l"' : '') + '>' + esc(s.planned || '') + '</td><td' + (plain ? ' class="l"' : '') + '>' + esc(nextAssign(s.id)) + '</td><td class="n">' + (c ? c + '회로' : '-') + '</td><td' + (plain ? ' class="l"' : '') + '>' + esc(s.memo || '') + '</td></tr>';
  });
  return h + '</tbody></table>';
}
function viewStatus() {
  const all = stores(), m = summary(all), rows = statusRows(), gs = groupsOf(all);
  let h = '<div class="kpis">' +
    [['점검 대상', m.total, '곳'], ['점검완료', m.done, '곳 (' + m.pct + '%)'], ['남은 점포', m.left, '곳'], ['점검취소', m.cancel, '곳'], ['결선도 작성', m.sheet, '곳']].map(k => '<div class="kpi"><div class="lb">' + k[0] + '</div><div class="v">' + k[1] + '<small>' + k[2] + '</small></div></div>').join('') + '</div>';
  h += '<h3 class="sec">구간별 진행</h3>' + groupTable(all, false);
  h += '<h3 class="sec">점포별 현황 <span class="st">' + rows.length + '곳</span></h3><div class="bar">' +
    '<select id="fg" aria-label="구간"><option value="">전체 구간</option>' + gs.map(g => '<option' + (F.group === g ? ' selected' : '') + ' value="' + esc(g) + '">' + esc(g) + '</option>').join('') + '</select>' +
    '<select id="fs" aria-label="상태"><option value="">전체 상태</option>' + STATUS.map(s => '<option' + (F.status === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>' +
    '<input id="fq" type="search" placeholder="점포명·주소·메모 검색" value="' + esc(F.q) + '" style="width:260px"></div>' + storeTable(rows, false);
  return h;
}

/* ---------- 현장 사진 (폰에서 찍은 사진, 서버를 거쳐서만 가져온다) ---------- */
const photoURL = {}, asked = new Set();
function b64blob(s) { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: 'image/jpeg' }); }
function stamp(ms) { const d = new Date(ms || 0); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function storePhotos(id) { return Object.keys(D.photos || {}).filter(k => D.photos[k] && D.photos[k].store === id).map(k => Object.assign({ id: k }, D.photos[k])).sort((a, b) => (a.at || 0) - (b.at || 0)); }
async function loadThumbs(list) {
  const need = list.filter(p => p.thumbId && !photoURL[p.id] && !asked.has(p.id));
  if (!need.length) return;
  need.forEach(p => asked.add(p.id));
  for (let i = 0; i < need.length; i += 12) {
    const part = need.slice(i, i + 12);
    try {
      const r = await sendToGas('safetyPhotoGet', { ids: part.map(p => p.thumbId) });
      ((r && r.data) || []).forEach(row => { const p = part.find(x => x.thumbId === row.id); if (p && row.b64) photoURL[p.id] = URL.createObjectURL(b64blob(row.b64)); });
    } catch (e) { part.forEach(p => asked.delete(p.id)); break; }   // 실패하면 다음에 화면을 그릴 때 다시 시도
  }
  if (tab === 'sheet') render();
}
function photosHTML(storeId) {
  const ph = storePhotos(storeId);
  if (!ph.length) return '<div class="pcap">등록된 현장 사진이 없습니다.</div>';
  loadThumbs(ph);
  return '<div class="pcap">현장 사진 ' + ph.length + '장 · 눌러서 크게 보기</div><div class="pthumbs">' + ph.map(p =>
    '<button type="button" data-ph="' + esc(p.id) + '" title="' + esc((p.by || '') + ' ' + stamp(p.at)) + '">' + (photoURL[p.id] ? '<img src="' + photoURL[p.id] + '" alt="현장 사진">' : '<span class="pcap">불러오는 중</span>') + '</button>').join('') + '</div>';
}
async function openPhoto(id) {
  const p = D.photos[id]; if (!p) return;
  const s = D.stores[p.store], el = $('pv'); el.classList.remove('full'); el.hidden = false;
  const meta = esc((s ? s.name + ' · ' : '') + (p.by ? p.by + ' · ' : '') + stamp(p.at));
  const head = '<div class="pvh"><button class="btn" data-pv="close" type="button">닫기</button><button class="btn" data-pv="zoom" type="button">크게 보기</button><span class="sp"></span><span>' + meta + '</span>';
  el.innerHTML = head + '</div><div class="pvb"><div class="pvw">불러오는 중입니다. 몇 초 걸릴 수 있어요.</div></div>';
  try {
    const r = await sendToGas('safetyPhotoGet', { ids: [p.fileId] }), row = r && r.data && r.data[0];
    if (!row || !row.b64) throw new Error('없음');
    if (el.hidden) return;
    const u = URL.createObjectURL(b64blob(row.b64));
    el.innerHTML = head + '<a class="btn" download="' + esc((s ? s.name : '사진') + '_' + stamp(p.at).replace(/[\s:\/]/g, '')) + '.jpg" href="' + u + '">내려받기</a></div><div class="pvb"><img src="' + u + '" alt="현장 사진 크게 보기"></div>';
  } catch (e) { if (!el.hidden) el.querySelector('.pvb').innerHTML = '<div class="pvw">사진을 가져오지 못했습니다. 연결을 확인하고 다시 눌러 주세요.</div>'; }
}

/* ---------- 결선도 ---------- */
function sheetStores() { return stores().filter(s => showEmpty || circuits(s.id).length || storePhotos(s.id).length); }
function sheetPaper(s) { return '<section class="pgbreak">' + SafetyCore.paperHTML(s, D.sheets[s.id]) + '</section>'; }
function viewSheet() {
  const list = sheetStores(), first = [...picked].find(id => D.stores[id]);
  let h = '<div class="bar"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="se" style="min-height:0;width:18px;height:18px"' + (showEmpty ? ' checked' : '') + '> 작성하지 않은 점포도 보기</label><span class="sp"></span>' +
    '<button class="btn" id="pall" type="button">전체 선택</button><button class="btn" id="pnone" type="button">선택 해제</button></div>';
  h += '<div class="two"><div class="slist">' + (list.length ? list.map(s => '<label><input type="checkbox" data-id="' + esc(s.id) + '"' + (picked.has(s.id) ? ' checked' : '') + '><span class="nm">' + esc(s.name) + '</span><span class="cn">' + (circuits(s.id).length ? circuits(s.id).length + '회로' : '미작성') + (storePhotos(s.id).length ? ' · 사진 ' + storePhotos(s.id).length : '') + '</span></label>').join('') : '<div class="empty">작성된 결선도가 없습니다.</div>') + '</div>' +
    '<div class="prev">' + (first ? photosHTML(first) + '<div class="paper port">' + sheetPaper(D.stores[first]) + '</div>' : '<div class="msg">왼쪽에서 점포를 고르면 결선도가 보이고, 위의 인쇄 버튼으로 선택한 점포를 한 장씩 인쇄해요.</div>') + '</div></div>';
  return h;
}

/* ---------- 동선 일정 ---------- */
function routeRows() {
  const t = todayStr();
  return Object.values(D.routes).filter(r => (r.stops || []).length && (routeFrom === 'all' || r.date >= t)).sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.owner || '').localeCompare(b.owner || '', 'ko'));
}
function routeTable(rows, plain) {
  let h = '<table class="' + (plain ? '' : 'tbl') + '"><thead><tr><th>날짜</th><th>담당</th><th class="n">점포</th><th>시작</th><th>점포 순서</th></tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="5" class="empty">저장된 동선이 없습니다.</td></tr>';
  rows.forEach(r => {
    const names = (r.stops || []).map(id => D.stores[id]).filter(Boolean).map(s => s.name);
    h += '<tr><td>' + esc(dlabel(r.date)) + '</td><td><b>' + esc(r.owner || '담당 미정') + '</b></td><td class="n">' + names.length + '</td><td>' + esc(r.start || '09:00') + '</td><td' + (plain ? ' class="wrapcell"' : '') + '>' + esc(names.join(' → ')) + '</td></tr>';
  });
  return h + '</tbody></table>';
}
function viewRoute() {
  const rows = routeRows();
  return '<div class="bar"><select id="rf" aria-label="기간"><option value="today"' + (routeFrom === 'today' ? ' selected' : '') + '>오늘 이후</option><option value="all"' + (routeFrom === 'all' ? ' selected' : '') + '>전체</option></select><span class="st">' + rows.length + '건</span></div>' + routeTable(rows, false);
}

/* ---------- 화면, 인쇄, CSV ---------- */
function render() {
  const n = Object.keys(D.stores).length;
  $('meta').textContent = n ? '점포 ' + n + '곳 · 입력된 데이터를 보고서로 출력합니다.' + (loadedAt ? ' (방금 불러옴)' : ' (보관해 둔 데이터, 새로 불러오는 중)') : '데이터가 아직 없습니다.';
  if (!n) { $('view').innerHTML = '<div class="msg">' + (loadedAt ? '안전점검 앱에 점포 데이터가 아직 없습니다.' : '불러오는 중…') + '</div>'; return; }
  const keepQ = document.activeElement && document.activeElement.id === 'fq';
  $('view').innerHTML = tab === 'status' ? viewStatus() : tab === 'sheet' ? viewSheet() : viewRoute();
  if (keepQ) { const q = $('fq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function setTab(t) { tab = t; document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t))); render(); }
function head(title, sub) { return '<h1>' + title + '</h1><div class="sub">' + esc(sub) + ' · 출력일 ' + todayLabel() + (who() ? ' · 출력자 ' + esc(who()) : '') + '</div>'; }
function printNow() {
  const pa = $('printArea');
  if (tab === 'status') {
    const rows = statusRows(), m = summary(stores());
    pa.innerHTML = '<div class="land">' + head('안전점검 현황 보고서', 'GS더프레시 안전점검') +
      '<div class="kp">' + [['점검 대상', m.total], ['점검완료', m.done + ' (' + m.pct + '%)'], ['남은 점포', m.left], ['점검취소', m.cancel], ['결선도 작성', m.sheet]].map(k => '<div>' + k[0] + '<b>' + k[1] + '</b></div>').join('') + '</div>' +
      '<h2>구간별 진행</h2>' + groupTable(stores(), true) + '<h2>점포별 현황 (' + rows.length + '곳)</h2>' + storeTable(rows, true) + '</div>';
  } else if (tab === 'sheet') {
    const ids = [...picked].filter(id => D.stores[id]);
    if (!ids.length) { $('meta').innerHTML = '<span class="err">인쇄할 점포를 먼저 골라 주세요.</span>'; return; }
    pa.innerHTML = '<div class="port">' + ids.map(id => sheetPaper(D.stores[id])).join('') + '</div>';
  } else {
    pa.innerHTML = '<div class="land">' + head('동선 일정 보고서', routeFrom === 'all' ? '전체 기간' : '오늘 이후') + routeTable(routeRows(), true) + '</div>';
  }
  window.print();
}
function csvDownload() {
  let rows;
  if (tab === 'route') rows = [['날짜', '담당', '점포 수', '시작', '점포 순서']].concat(routeRows().map(r => { const ns = (r.stops || []).map(id => D.stores[id]).filter(Boolean).map(s => s.name); return [r.date, r.owner || '', ns.length, r.start || '', ns.join(' → ')]; }));
  else rows = [['No', '점포명', '구분', '지역', '구간', '상태', '예상 작업일', '다음 담당', '결선도 회로 수', '메모']].concat(statusRows().map(s => [s.no, s.name, s.type, region(s.address), s.group || '', s.status, s.planned || '', nextAssign(s.id), circuits(s.id).length, s.memo || '']));
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = (tab === 'route' ? '동선일정_' : '안전점검현황_') + todayStr().replace(/-/g, '') + '.csv'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); });
$('print').addEventListener('click', printNow);
$('csv').addEventListener('click', csvDownload);
$('reload').addEventListener('click', refresh);
$('view').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fg') { F.group = t.value; render(); } else if (t.id === 'fs') { F.status = t.value; render(); }
  else if (t.id === 'rf') { routeFrom = t.value; render(); }
  else if (t.id === 'se') { showEmpty = t.checked; render(); }
  else if (t.dataset && t.dataset.id) { t.checked ? picked.add(t.dataset.id) : picked.delete(t.dataset.id); render(); }
});
$('view').addEventListener('input', e => { if (e.target.id === 'fq') { F.q = e.target.value; render(); } });
$('pv').addEventListener('click', e => {
  const b = e.target.closest('[data-pv]'); if (!b) return;
  if (b.dataset.pv === 'close') { $('pv').hidden = true; $('pv').innerHTML = ''; }
  else { const on = $('pv').classList.toggle('full'); b.textContent = on ? '작게 보기' : '크게 보기'; }
});
$('view').addEventListener('click', e => {
  const ph = e.target.closest('[data-ph]'); if (ph) { openPhoto(ph.dataset.ph); return; }
  if (e.target.id === 'pall') { sheetStores().forEach(s => picked.add(s.id)); render(); }
  if (e.target.id === 'pnone') { picked.clear(); render(); }
});

if (useCache()) render();
refresh();
</script>
</body>
</html>
