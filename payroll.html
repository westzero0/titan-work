<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인건비 계산</title>
<link rel="stylesheet" href="pc.css">
<style>
  body { margin: 0; padding: 32px 40px 48px; }
  .wrap { max-width: 860px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  #sum table { margin-top: 0; }
  #sum small { color: var(--text-sub); margin-left: 4px; }
  #res { margin-top: 16px; }
  #res a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 20px; border-radius: var(--r); background: var(--ok); color: #fff; font-weight: 700; text-decoration: none; }
  .hint { color: var(--text-sub); font-size: 13px; margin: 0 0 14px; }
</style>
</head>
<body>
<div class="wrap">
<div class="page-head"><div><h2>인건비 계산</h2><p>월을 고르면 직원별 근무일수·공수·금액을 먼저 보여줍니다. 금액은 공수 × 일당이며, 확인한 뒤 엑셀로 만들 수 있습니다.</p></div></div>
<div class="tools">
  <input type="month" id="month" aria-label="정산 월">
  <button class="btn btn-primary" id="show">조회</button>
  <button class="btn" id="go">엑셀로 만들기</button>
</div>
<div id="sum"></div>
<div id="res"></div>
</div>
<script src="common.js"></script>
<script>
  const d = new Date();
  document.getElementById('month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = n => Math.round(n).toLocaleString('ko-KR');
  const sum = document.getElementById('sum');
  document.getElementById('show').addEventListener('click', async () => {
    const month = document.getElementById('month').value;
    if (!month) { alert('월을 선택해 주세요.'); return; }
    sum.innerHTML = '<p class="msg">불러오는 중…</p>';
    try {
      const g = await sendToGas('getGongsuMatrix', { month });
      if (g.status === 'ERROR') throw new Error(g.message);
      const m = await sendToGas('getQuoteMaster', {});
      if (m.status === 'ERROR') throw new Error(m.message);
      const rate = Object.fromEntries((m.workers || []).map(w => [w.name, w]));
      const st = {}; // 직원 → {days:Set, gongsu}
      (g.rows || []).forEach(r => Object.entries(r.workerValues || {}).forEach(([n, v]) => {
        const x = (Number(v.day) || 0) + (Number(v.night) || 0); if (!x) return;
        const o = st[n] || (st[n] = { days: new Set(), gongsu: 0 }); o.days.add(r.date); o.gongsu += x;
      }));
      const names = Object.keys(st).sort();
      if (!names.length) { sum.innerHTML = '<p class="msg">이 달에는 공수 기록이 없습니다.</p>'; return; }
      let tg = 0, tm = 0, tdays = 0;
      const rows = names.map(n => {
        const w = rate[n], r = w ? Number(w.dayRate) || 0 : 0, o = st[n], amt = o.gongsu * r;
        tg += o.gongsu; tm += amt; tdays += o.days.size;
        return `<tr><td>${esc(n)} <small>${esc(w ? w.role : '')}</small>${r ? '' : ' <span class="warn">일당 없음</span>'}</td><td class="n">${o.days.size}일</td><td class="n">${Math.round(o.gongsu * 100) / 100}</td><td class="n">${won(r)}</td><td class="n">${won(amt)}원</td></tr>`;
      }).join('');
      sum.innerHTML = `<table class="tbl"><thead><tr><th>직원</th><th class="n">근무일수</th><th class="n">공수</th><th class="n">일당</th><th class="n">금액</th></tr></thead><tbody>${rows}</tbody>
        <tfoot><tr><td>합계</td><td class="n">${tdays}일</td><td class="n">${Math.round(tg * 100) / 100}</td><td></td><td class="n">${won(tm)}원</td></tr></tfoot></table>`;
    } catch (e) { sum.innerHTML = '<p class="err"></p>'; sum.firstChild.textContent = e.message; }
  });
  const res = document.getElementById('res'), go = document.getElementById('go');
  go.addEventListener('click', async () => {
    const month = document.getElementById('month').value;
    if (!month) { alert('정산할 월을 선택해 주세요.'); return; }
    go.disabled = true; res.textContent = '정산 중입니다. 10~20초 걸릴 수 있습니다.';
    try {
      // 서버(generatePayroll)는 month를 data 안이 아니라 최상위에서 읽어서 sendToGas를 쓰지 않고 직접 보냄
      const r = await (await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'generatePayroll', month }), redirect: 'follow' })).json();
      if (r.status !== 'SUCCESS') throw new Error(r.message || '정산 실패');
      res.innerHTML = '';
      const a = document.createElement('a'); a.href = r.downloadUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '정산 완료. 엑셀 내려받기';
      res.appendChild(a);
    } catch (e) { res.innerHTML = '<span class="err"></span>'; res.firstChild.textContent = e.message; }
    go.disabled = false;
  });
</script>
</body>
</html>
