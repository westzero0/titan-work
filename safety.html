<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E4272">
<title>안전점검 수첩</title>
<!-- 타이탄 안의 별도 페이지: 로그인(이름+4자리)과 저장소(구글 시트)를 타이탄과 같이 쓴다. 이전 Firebase 버전은 D:\안전점검수첩\index.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 손 조작용 모바일 목록: 고정 상단바(진행률, 검색, 상태 필터) 아래에 점포 카드, 설정은 전체 화면 시트 */
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --ink:#16202A; --muted:#58656F; --line:#D8DCD4;
  --band:#1E4272; --band-ink:#FFFFFF; --band-soft:#B9CBE4; --accent:#1E4272; --accent-ink:#FFFFFF;
  --todo:#58656F; --todo-bg:#E6E9E3;
  --talk:#8F5300; --talk-bg:#FAE8C2;
  --sched:#1B5EA6; --sched-bg:#DAE9F8;
  --done:#42700C; --done-bg:#E2EDCB;
  --danger:#B42318; --danger-bg:#FCE3E0;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#182028; --ink:#E8EDF1; --muted:#9AA7B3; --line:#2B3641;
    --band:#1B2E48; --band-ink:#F2F6FA; --band-soft:#8DA6C6; --accent:#8DB8F0; --accent-ink:#0E1A2A;
    --todo:#9AA7B3; --todo-bg:#242D35;
    --talk:#F0B84A; --talk-bg:#3A2C0C;
    --sched:#86B9F2; --sched-bg:#16314F;
    --done:#A9D45E; --done-bg:#27350F;
    --danger:#FF8D81; --danger-bg:#3E1814;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#182028; --ink:#E8EDF1; --muted:#9AA7B3; --line:#2B3641;
  --band:#1B2E48; --band-ink:#F2F6FA; --band-soft:#8DA6C6; --accent:#8DB8F0; --accent-ink:#0E1A2A;
  --todo:#9AA7B3; --todo-bg:#242D35;
  --talk:#F0B84A; --talk-bg:#3A2C0C;
  --sched:#86B9F2; --sched-bg:#16314F;
  --done:#A9D45E; --done-bg:#27350F;
  --danger:#FF8D81; --danger-bg:#3E1814;
  color-scheme:dark;
}
:root[data-fs="lg"]{font-size:18px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4{text-wrap:balance}
p,li,dd{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:46rem;margin-inline:auto;padding-inline:16px}

/* 상단 고정 영역 */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--band);z-index:3}
html{scroll-padding-top:var(--toph,9rem)}
body{padding-top:var(--toph,9rem)}
.subwrap{position:relative;z-index:1;background:var(--bg);transition:transform .2s,visibility 0s}
html.sub-hide .subwrap{transform:translateY(-100%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
.band{position:relative;z-index:2;background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.band h1{margin:0;font-size:1.0625rem;font-weight:700;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.count{font:500 0.9375rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font:400 0.75rem var(--font);color:var(--band-soft);margin-left:4px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);display:grid;place-items:center;flex:none}
.bar{height:5px;background:color-mix(in srgb,var(--band-ink) 22%,transparent)}
.bar i{display:block;height:100%;width:0;background:#B5DB6A;transition:width .25s}
.search{padding-block:10px 6px}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-inline:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font:500 0.875rem var(--mono);font-variant-numeric:tabular-nums}
#plansw{gap:0;padding:0;margin-block:8px 6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
#plansw[hidden]{display:none}
#plansw .chip{flex:1;justify-content:center;padding:0 6px;border:0;border-radius:0;border-right:1px solid var(--line);background:none}
#plansw .chip:last-child{border-right:0}
#plansw .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.filters{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding-block:4px}
.filters select{min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-inline:8px;font-size:0.875rem;text-overflow:ellipsis}

/* 목록 */
main{padding-block:4px calc(6rem + env(safe-area-inset-bottom,0px))}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.divider{margin:14px 0 2px;font-size:0.8125rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row1{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 4px}
.check{width:48px;height:48px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:50%}
.check span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s}
.check[aria-pressed="true"] span{background:var(--done);border-color:var(--done);color:var(--surface)}
.head{flex:1;min-width:0;min-height:48px;background:none;border:0;text-align:left;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.nm{font-weight:700;font-size:1.0625rem;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:0.8125rem}
.code{font:500 0.8125rem var(--mono)}
.pill{flex:none;font-size:0.75rem;font-weight:500;border-radius:6px;padding:3px 8px}
.pill.todo,.seg .todo.on{background:var(--todo-bg);color:var(--todo)}
.pill.talk,.seg .talk.on{background:var(--talk-bg);color:var(--talk)}
.pill.sched,.seg .sched.on{background:var(--sched-bg);color:var(--sched)}
.pill.done,.seg .done.on{background:var(--done-bg);color:var(--done)}
.pill.cancel,.seg .cancel.on{background:var(--danger-bg);color:var(--danger)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 14px 10px 58px;font-size:0.8125rem;color:var(--muted)}
.sub .when{font-family:var(--mono);color:var(--ink)}
.flag{border-radius:6px;padding:2px 7px;font-size:0.75rem;font-weight:500}
.flag.ok{background:var(--done-bg);color:var(--done)}
.flag.warn{background:var(--talk-bg);color:var(--talk)}
.flag.bad{background:var(--danger-bg);color:var(--danger)}

.detail{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:0.8125rem;padding:0 2px;word-break:keep-all}
.seg button.on{font-weight:700;border-color:transparent}
.blk h3,.blk>label{margin:0 0 6px;font-size:0.75rem;font-weight:700;letter-spacing:.05em;color:var(--muted);display:block}
.addr{margin:0 0 8px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn,a.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-size:0.9375rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.contacts{display:flex;flex-direction:column;gap:8px}
.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct .lab{color:var(--muted);font-size:0.8125rem;min-width:3.2rem}
.ct .num{font:500 1rem var(--mono);flex:1 1 9rem;user-select:all}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0}
.facts dt{font-size:0.75rem;color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hols{display:flex;flex-wrap:wrap;gap:6px}
.hol{font:500 0.875rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.hol.past{color:var(--muted);text-decoration:line-through}
.hol.today{background:var(--done-bg);color:var(--done);border-color:transparent}
.detail input[type=text],.detail textarea,.sheet input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.detail textarea{min-height:5.5rem;resize:vertical}

.empty{margin-top:24px;padding:20px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:12px}
.empty h2{margin:0;font-size:1.0625rem}
.empty p{margin:0;color:var(--muted)}

/* 묶어 보기 */
.viewnote{margin:6px 0 0}
.viewnote summary{min-height:44px;display:flex;align-items:center;color:var(--muted);font-size:0.8125rem;cursor:pointer}
.card.compact .row1{padding-block:0}
.card.compact .nm{font-size:1rem}
.card.compact .when{font-family:var(--mono);color:var(--ink)}
.sec2{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sh{width:100%;min-height:56px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t p" "m p" "b b";column-gap:10px;row-gap:2px;align-items:center;text-align:left}
.sh[aria-expanded="true"]{border-color:var(--accent)}
.sh .st{grid-area:t;font-weight:700;overflow-wrap:anywhere}
.sh .sm{grid-area:m;font-size:0.8125rem;color:var(--muted)}
.sh .sp{grid-area:p;font:500 0.9375rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh .mb{grid-area:b;display:block;height:4px;border-radius:2px;background:var(--todo-bg);margin-top:6px;overflow:hidden}
.sh .mb b{display:block;height:100%;background:var(--done)}
.sh:not(:has(.mb)) {grid-template-areas:"t p" "m p"}
.subh.dh{font-size:1rem;color:var(--ink);letter-spacing:0;margin-top:12px}
.sb{display:flex;flex-direction:column;gap:8px}
.subh{margin:8px 0 0;font-size:0.8125rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{min-height:58px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.8125rem;letter-spacing:-0.02em;color:var(--muted);padding:0 1px;word-break:keep-all}
.tabs button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.tabs button[aria-pressed="true"] svg{stroke-width:2.4}

/* 지도, 동선 */
.mapwrap{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fits{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fits::-webkit-scrollbar{display:none}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
#mapsvg{display:block;width:100%;height:min(46vh,400px);touch-action:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.mapmv{align-self:flex-start}
#mapsvg.mv{touch-action:none}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.375rem;line-height:1}
.pn{stroke:var(--surface)}
.pn.todo{fill:var(--todo)}.pn.talk{fill:var(--talk)}.pn.sched{fill:var(--sched)}.pn.done{fill:var(--done)}.pn.cancel{fill:var(--danger)}
.pn.off{fill:var(--line);stroke:none}
.ck{fill:var(--surface);text-anchor:middle;font-weight:700;pointer-events:none}
.maplbl{fill:var(--muted);font-family:var(--font);pointer-events:none}
.plb{fill:var(--ink);stroke:var(--surface);paint-order:stroke;font-family:var(--font);font-weight:500;pointer-events:none}
.rline{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rbadge{fill:var(--accent);stroke:var(--surface);pointer-events:none}
.rn{fill:var(--accent-ink);font-family:var(--mono);font-weight:700;text-anchor:middle;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:0.75rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.dot.todo{background:var(--todo)}.dot.talk{background:var(--talk)}.dot.sched{background:var(--sched)}.dot.done{background:var(--done)}.dot.cancel{background:var(--danger)}
.rbox{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rh{margin:10px 0 0;font-size:1.0625rem}
.rbox .rh{margin:0}
.rh small{font-size:0.8125rem;color:var(--muted);font-weight:400;margin-left:6px}
.rform{display:grid;grid-template-columns:minmax(0,1fr) 9.5rem;gap:8px}
.rform input,.radd select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%;min-width:0}
.radd{display:flex;gap:8px}
.radd select{flex:1}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 10px;background:var(--bg)}
.sn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 0.8125rem var(--mono)}
.si{display:flex;flex-direction:column;gap:2px;min-width:0}
.si b{overflow-wrap:anywhere}
.sa{display:flex;gap:4px}
@media (max-width:480px){.stop{grid-template-columns:auto minmax(0,1fr)}.stop .sa{grid-column:1/-1}.stop .sa .mini{flex:1}}
.mini{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-size:0.875rem;padding:0 6px}
.mini:disabled{opacity:.35}
.rcard{padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rtop .sp{font:500 0.9375rem var(--mono)}
.rnames{font-size:0.875rem;overflow-wrap:anywhere}
.tabs button{position:relative}
.tb{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 0.6875rem var(--mono);display:grid;place-items:center;padding:0 4px}
.tb[hidden]{display:none}
.addb{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:700 1rem var(--mono)}
.addb.on{background:var(--accent);color:var(--accent-ink)}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn.sm{min-height:44px;font-size:0.8125rem;padding:0 12px;letter-spacing:0;color:var(--accent);border-color:var(--accent)}
.datebar .btn{flex:none;white-space:nowrap}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:0.875rem}

/* 캘린더 */
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.calh b{font-size:1.0625rem}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.dow{text-align:center;font-size:0.75rem;color:var(--muted);padding:4px 0}
.dow.sun,.day.sun .dn{color:var(--danger)}
.day{min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;font-size:0.75rem;min-width:0}
.day .dn{font:600 0.9375rem var(--mono);display:flex;justify-content:space-between;align-items:center}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sel{background:var(--sched-bg)}
.day.inp{border-bottom:4px solid var(--accent)}
.cw,.ch,.cp{border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;font:700 0.8125rem var(--mono);text-align:center}
.cw{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ch{background:var(--done-bg);color:var(--done)}
.cp{border:1px dashed var(--muted);color:var(--muted)}
.rd{width:8px;height:8px;border-radius:50%;background:var(--talk);display:inline-block}
.bar2{display:inline-block;width:14px;height:4px;background:var(--accent);margin-right:4px;vertical-align:middle}
.legend b.lg{display:inline-block;margin-right:4px;font-family:var(--font);font-size:0.75rem;padding:1px 6px}
.cday{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.crow .when{font-family:var(--mono);color:var(--ink)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tl li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:8px;align-items:baseline}
.tt{font:500 0.9375rem var(--mono);font-variant-numeric:tabular-nums}
.tm{font-family:var(--mono)}
.rform2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rform2 label{display:flex;flex-direction:column;gap:4px;font-size:0.75rem;color:var(--muted)}
.rform2 input,.rform2 select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;width:100%;min-width:0}
@media (max-width:420px){.rform{grid-template-columns:minmax(0,1fr)}}

/* 담당자별 동선 */
.orow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
/* 오늘 */
/* 목록·계획 = 점검표: 카드 대신 줄이 그어진 목록. 번호 칸 대신 체크 칸, 상태는 글자, 점검완료는 작은 도장 */
.list{gap:0}
#list .card.lrow{background:none;border:0;border-radius:0;border-bottom:1px solid var(--line)}
#list .lrow .row1{padding:4px 0 4px 0}
#list .lrow .check span{border-radius:3px;border:1.5px solid var(--ink)}
#list .lrow .check[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#list .lrow.fin .nm{color:var(--muted);font-weight:500}
#list .lrow .sub{padding-right:0}
.lst{flex:none;font-size:0.8125rem;color:var(--muted);white-space:nowrap}
.lst.sched{color:var(--ink);font-weight:700}
.lst.cancel{text-decoration:line-through}
.stamp{display:inline-block;border:2px solid var(--accent);color:var(--accent);border-radius:4px;padding:2px 8px;font-weight:700;font-size:0.8125rem;letter-spacing:0.08em;transform:rotate(-5deg);opacity:.9}
.stamp.sm{padding:1px 6px;font-size:0.75rem;letter-spacing:0.04em;transform:rotate(-4deg)}
#list .flag{background:none;border-radius:0;padding:0;font-weight:600}
#list .flag.ok{color:var(--done)}
#list .flag.warn{color:var(--talk)}
#list .flag.bad{color:var(--danger)}
#list .flag.bad::before{content:"! "}
#list .addb{border-radius:4px}
#list .btn,#list .seg button,#list .detail input[type=text],#list .detail textarea{border-radius:4px}
#list .lrow .detail{padding:12px 0 14px;border-top:1px solid var(--line)}
.divider{margin:20px 0 0;padding:8px 0 4px;border-top:2px solid var(--ink);font-size:0.875rem;letter-spacing:0;color:var(--ink)}
.sec2{gap:0;margin-top:14px}
#list .sh{background:none;border:0;border-radius:0;border-top:2px solid var(--ink);padding:10px 0}
#list .sh[aria-expanded="true"]{border-top-color:var(--ink)}
#list .sh .mb{border-radius:0}
#list .sh .mb b{border-radius:0}
#list .empty{border:0;border-top:2px solid var(--ink);border-radius:0;padding:16px 0}
.search input,.filters select{border-radius:4px}
.datebar{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding-left:0}
.chip{border-radius:4px}
#plansw{border-radius:4px}
/* 오늘 = 동선을 한 줄 노선으로: 왼쪽에 시간, 가운데 선과 점, 오른쪽에 점포. 지나온 구간은 연두 실선, 남은 구간은 점선 */
.today .thead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 14px}
.today .tform{margin:0;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.today .tsum{margin:6px 0 0;font-size:0.8125rem;color:var(--muted)}
.today .tsum b{color:var(--ink)}
.today .tcount{text-align:right;font-size:0.75rem;color:var(--muted);flex:none}
.today .tcount b{display:block;font:700 1.75rem/1 var(--mono);color:var(--accent)}
.tlist{list-style:none;margin:0;padding:0}
.tr{display:grid;grid-template-columns:64px 28px minmax(0,1fr)}
.tr-tm{padding:2px 8px 0 0;text-align:right;font:600 1rem/1.3 var(--mono);color:var(--ink)}
.tr-tm small{display:block;margin-top:1px;font:400 0.75rem var(--font);color:var(--muted)}
.tr-rail{position:relative}
.tr-rail::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:6px;background:var(--lime,#B5DB6A)}
.tr:first-child .tr-rail::before{top:12px}
.tr:last-child .tr-rail::before{bottom:calc(100% - 12px)}
.tr-dot{position:absolute;left:5px;top:3px;width:18px;height:18px;border-radius:50%;box-sizing:border-box;background:var(--surface);border:3px solid var(--muted);z-index:1}
.tr-body{padding:0 0 22px 6px;min-width:0}
.tr-head{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:44px;padding:0;background:none;border:0;text-align:left;color:inherit;gap:1px}
.tr-head small,.tr-meta{font-size:0.8125rem;color:var(--muted)}
.tr-meta{display:block;margin-top:2px}
/* 끝난 점포: 연두 점에 체크, 이름은 흐리게 */
.tr.done .tr-dot{background:var(--lime,#B5DB6A);border-color:var(--accent)}
.tr.done .tr-dot::after{content:"";position:absolute;left:3px;top:-1px;width:5px;height:9px;border:solid var(--accent);border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.tr.done .nm{color:var(--muted);font-weight:500}
.tr-dot.fresh{animation:dotPop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes dotPop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tr-dot.fresh{animation:none}}
/* 남은 점포: 빈 점, 점선 */
.tr.todo .tr-rail::before{width:3px;left:13px;background:repeating-linear-gradient(to bottom,var(--muted) 0 5px,transparent 5px 10px)}
/* 다음 점포: 큰 점, 점선(남색), 펼쳐진 버튼 */
.tr.next .tr-rail::before{width:4px;left:12px;top:0;background:repeating-linear-gradient(to bottom,var(--accent) 0 6px,transparent 6px 11px)}
.tr.next .tr-dot{left:1px;top:2px;width:26px;height:26px;background:var(--surface);border:5px solid var(--accent);box-shadow:0 0 0 4px var(--lime,#B5DB6A)}
.tr.next .tr-tm{color:var(--accent);font-weight:700}
.tr.next .nm{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;display:block}
.topen{padding:6px 0 0;display:flex;flex-direction:column;gap:10px}
.today .btn{border-radius:4px}
.tact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tact .btn{padding:0 2px;font-size:0.875rem;white-space:nowrap}
.tact .btn.dis{color:var(--muted);opacity:.6}
.tact.big{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.tact.big .btn{min-height:52px;font-size:1rem}
.tact.big .tdone{grid-column:1/-1;min-height:60px;font-size:1.125rem;font-weight:700}
.more{min-height:44px;background:none;border:0;color:var(--muted);font-size:0.875rem;width:100%}
.today .detail{border-top:1px solid var(--line);padding:14px 0 0}
.tempty{margin-top:18px;padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tempty b{font-size:1.0625rem}
.tempty p{margin:0;color:var(--muted)}
.today .rbox{margin-top:10px;background:none;border:0;border-radius:0;border-top:1px solid var(--line);padding:12px 0 0}
.today .rbox .rh{font-size:0.9375rem}
/* 분전반 결선도 */
.wbody{padding-block:4px 6rem}
.wgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wgrid2 label,.wgrid label{display:flex;flex-direction:column;gap:4px;font-size:0.75rem;color:var(--muted);min-width:0}
.wbody input{scroll-margin-top:90px;scroll-margin-bottom:40vh}
.wl{font-size:0.75rem;color:var(--muted);margin-bottom:4px}
.wbody input[type=text],.wbody select{min-height:44px;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;color:var(--ink)}
.wrow{scroll-margin-top:64px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.wgrid4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wdelb{min-width:60px;padding:0 8px;font-size:0.8125rem;white-space:nowrap}
.wseg{display:flex;gap:6px}
.wseg button{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.wseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.wadd{width:100%;margin-top:14px}
/* 현장 사진 */
.wphotos{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pth{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:44px}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:0.6875rem;padding:2px 4px}
.wphotos .whd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wphotos label.btn{cursor:pointer;justify-content:center}
.wphotos label.btn.disabled{opacity:.5;pointer-events:none}
.pview{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pview[hidden]{display:none}
.pview header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;color:#fff}
.pview header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.pview .pmeta{color:#cbd5e1;font-size:0.8125rem;padding:0 12px 8px}
.pview .pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.pview .pbody img{display:block;max-width:100%;margin:auto}
.pview.full .pbody img{max-width:none;margin:0}
.pview .pwait{color:#fff;margin:auto;padding:24px;text-align:center}
/* 결선도 인쇄 (A4 세로) */
#printsheet{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printsheet){display:none!important}
  #printsheet{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* 종이 모양(표, 회로 동그라미)은 safety-core.js가 PC 보고서와 같이 쓰는 한 벌이다 */
/* 설정 시트 */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{position:sticky;top:0;background:var(--band);color:var(--band-ink);z-index:2}
.sheet header .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.sheet h2{margin:0;font-size:1.0625rem}
.sheet header .btn{background:transparent;color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 35%,transparent)}
.sec{padding-block:20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font-size:1rem}
.sec p{margin:0;color:var(--muted);font-size:0.875rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px}
.opt input{width:22px;height:22px;flex:none}
.imp{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:14px}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map label{display:flex;flex-direction:column;gap:4px;font-size:0.75rem;color:var(--muted)}
.map select,.imp select{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-inline:8px;min-width:0;width:100%}
.scroll{overflow-x:auto}
.scroll table{border-collapse:collapse;font-size:0.8125rem;min-width:30rem}
.scroll th,.scroll td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.note{font-size:0.8125rem;color:var(--muted)}
.where{font-size:0.8125rem;color:var(--muted)}

#toast.act{width:max-content;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);pointer-events:auto;display:flex;align-items:center;gap:12px;padding:4px 4px 4px 16px}
#toast.act button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);background:transparent;color:var(--bg);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);pointer-events:none;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);font-size:0.9375rem}
@media (max-width:420px){.map{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.lbox{width:100%;max-width:22rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.lbox h1{margin:0;font-size:1.25rem}
.lbox p{margin:0;color:var(--muted)}
.lbox select,.lbox input{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 14px}
.lbox .btn{min-height:48px}
.statbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.whoami{font-size:0.8125rem;color:var(--band-ink);white-space:nowrap}
.whoami:empty{display:none}
.syncst{font-size:0.75rem;color:var(--band-soft);white-space:nowrap;background:none;border:0;min-height:44px;padding:0 6px;font-family:inherit;cursor:pointer}
.syncst[hidden]{display:none}
.lbox .lerr{color:var(--danger);min-height:1.5em}
</style>
</head>
<body>


<header class="top" id="topbar">
  <div class="band">
    <div class="wrap">
      <h1 id="title">안전점검 수첩</h1>
      <div class="statbox"><div class="count" id="count" aria-live="polite"></div><div class="whoami" id="whoami"></div></div>
      <button type="button" class="syncst" id="syncst" hidden></button>
      <button type="button" class="iconbtn" data-act="open-sheet" aria-label="설정 열기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>

<main class="wrap">

<nav class="tabs" id="tabs" aria-label="보기 전환">

  <button type="button" data-act="view" data-v="list" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>목록</button>
  <button type="button" id="planbtn" data-act="view" data-v="cal" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>계획</button>
</nav>

<div class="pview" id="pview" role="dialog" aria-modal="true" aria-label="현장 사진" hidden></div>
<div id="printsheet" aria-hidden="true"></div>
<div id="toast" role="status" hidden></div>

<script src="common.js"></script>

<script>(function(){var st=document.createElement('style');st.textContent='@media print{'+SafetyCore.paperCss('#printsheet')+'}';document.head.appendChild(st);})();</script>
<script>
/* ===== 타이탄 연결: 로그인(이름+4자리)과 저장소(구글 시트, Apps Script)를 타이탄과 같이 쓴다 =====
 * - 로그인: 타이탄과 같은 서버 동작(getWorkerList, loginCheck)을 쓰고, 이름은 같은 주소의 localStorage('titan_user_name')에 저장돼 타이탄과 공유된다.
 * - 저장소: Firestore처럼 collection().onSnapshot / doc().set·delete 를 흉내 내는 어댑터. 서버에는 safetyList, safetyBatch 두 동작만 쓴다.
 * - 오프라인: 마지막으로 받은 데이터를 폰에 보관하고, 못 보낸 저장은 대기열에 쌓았다가 연결되면 자동으로 보낸다.
 */
(function(){
  var LSC='safety-cache-v1',LSQ='safety-pending-v1',POLL=30000,COLS=['stores','routes','sheets','config','photos'];
  function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
  function post(body){return fetch(GAS_URL,{method:'POST',redirect:'follow',body:JSON.stringify(body)}).then(function(r){return r.text();}).then(function(t){return JSON.parse(t);});}

  /* ---------- 로그인 ---------- */
  function checkActive(name){
    return post({action:'loginCheck',userName:name,password:'SKIP_PASSWORD'}).then(function(r){
      if(r&&r.msg==='퇴사 처리된 계정입니다.'){localStorage.removeItem('titan_user_name');return false;}
      return true;
    }).catch(function(){return true;}); // 연결이 불안정하면 일단 들여보낸다(타이탄과 같은 방식)
  }
  function loginUI(){
    return new Promise(function(resolve){
      var o=document.createElement('div');o.className='login';
      o.innerHTML='<form class="lbox"><h1>안전점검 수첩</h1><p>타이탄 계정으로 로그인하세요.</p><select id="lname" aria-label="이름" required><option value="">이름을 선택하세요</option></select><input type="password" id="lpw" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 4자리" aria-label="비밀번호 4자리" required><button class="btn primary" type="submit">들어가기</button><p class="lerr" id="lerr" role="alert"></p></form>';
      document.body.appendChild(o);
      var f=o.querySelector('form'),sel=o.querySelector('#lname'),pw=o.querySelector('#lpw'),er=o.querySelector('#lerr'),btn=o.querySelector('button');
      post({action:'getWorkerList'}).then(function(list){
        (list||[]).forEach(function(n){var op=document.createElement('option');op.value=n;op.textContent=n;sel.appendChild(op);});
      }).catch(function(){er.textContent='이름 목록을 불러오지 못했어요. 인터넷을 확인하세요.';});
      f.addEventListener('submit',function(e){
        e.preventDefault();er.textContent='';btn.disabled=true;
        post({action:'loginCheck',userName:sel.value,password:pw.value}).then(function(r){
          btn.disabled=false;
          if(r&&r.res==='SUCCESS'){localStorage.setItem('titan_user_name',sel.value);o.remove();resolve(sel.value);}
          else{er.textContent=(r&&r.msg)||'로그인하지 못했어요.';pw.select();}
        }).catch(function(){btn.disabled=false;er.textContent='연결하지 못했어요. 잠시 뒤 다시 시도하세요.';});
      });
    });
  }
  var ready=null;
  window.TITAN_USER=localStorage.getItem('titan_user_name')||'';
  function login(){
    if(!ready){
      var n=localStorage.getItem('titan_user_name');
      if(n){ // 이름이 있으면 바로 들여보내고, 퇴사 처리 여부는 뒤에서 확인한다
        window.TITAN_USER=n;ready=Promise.resolve(n);
        checkActive(n).then(function(ok){if(!ok)location.reload();});
      }else ready=loginUI().then(function(name){window.TITAN_USER=name;return name;});
    }
    return ready;
  }

  /* ---------- 저장소 (Firestore 흉내) ---------- */
  var cache={stores:{},routes:{},sheets:{},config:{},photos:{}},pending=lsGet(LSQ,[]),listeners=[],sig={},polled=false,started=false,flushing=false,failed=0,epoch=0,flushT=null,stale=false,lastOk=0,canPatch=false;
  var saved=lsGet(LSC,{});COLS.forEach(function(c){if(saved[c])cache[c]=saved[c];});
  COLS.forEach(function(c){if(Object.keys(cache[c]).length)sig[c]=JSON.stringify(cache[c]);});
  function sync(){try{window.dispatchEvent(new CustomEvent('safety-sync',{detail:{pending:pending.length,failed:failed,stale:stale,last:lastOk}}));}catch(e){}}
  function split(path){var i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)];}
  function emit(l){
    if(l.id){var d=cache[l.c][l.id];l.cb({exists:d!==undefined,id:l.id,data:function(){return clone(d);}});}
    else{l.cb({docs:Object.keys(cache[l.c]).map(function(id){return {id:id,data:function(){return clone(cache[l.c][id]);}};})});}
  }
  function emitCol(c){listeners.forEach(function(l){if(l.c===c)emit(l);});}
  function call(a,d){
    return Promise.race([sendToGas(a,d),new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},30000);})]).then(function(r){
      if(r&&(r.status==='ERROR'||r.res==='ERROR'))throw new Error(r.message||r.msg||'서버 오류');
      return r;
    });
  }
  function enqueue(op){
    for(var i=0;i<pending.length;i++){if(pending[i].c===op.c&&pending[i].id===op.id){pending.splice(i,1);break;}}
    pending.push(op);lsSet(LSQ,pending);sync();
    clearTimeout(flushT);flushT=setTimeout(flush,250);
  }
  function flush(){
    if(flushing||!pending.length)return;
    flushing=true;var batch=pending.slice(0,40);
    call('safetyBatch',{ops:batch,user:window.TITAN_USER||''}).then(function(){
      pending=pending.filter(function(o){return batch.indexOf(o)<0;});lsSet(LSQ,pending);
      flushing=false;failed=0;epoch++;sync();
      if(pending.length)flush();
    }).catch(function(){
      flushing=false;failed++;sync();
      clearTimeout(flushT);flushT=setTimeout(flush,Math.min(60000,3000*failed));
    });
  }
  /* 점포는 바꾼 필드만 보내서(서버가 'patch'를 알 때) 두 사람이 같은 점포를 동시에 바꿔도 서로 안 덮어쓴다 */
  function put(c,id,obj){
    var old=cache[c][id],op={op:'set',c:c,id:id,data:clone(obj)};
    if(c==='stores'&&canPatch&&old){
      var diff={},n=0;Object.keys(obj).forEach(function(k){if(JSON.stringify(obj[k])!==JSON.stringify(old[k])){diff[k]=clone(obj[k]);n++;}});
      Object.keys(old).forEach(function(k){if(!(k in obj)){diff[k]=null;n++;}});
      if(!n)return Promise.resolve();
      var prev=null;pending.forEach(function(o){if(o.c===c&&o.id===id)prev=o;});
      if(!(prev&&prev.op==='set')){ // 아직 안 올라간 새 점포(set)면 전체를 그대로 보낸다
        if(prev&&prev.op==='patch')Object.keys(prev.data).forEach(function(k){if(!(k in diff))diff[k]=prev.data[k];});
        op={op:'patch',c:c,id:id,data:diff};
      }
    }
    cache[c][id]=clone(obj);lsSet(LSC,cache);emitCol(c);enqueue(op);return Promise.resolve();
  }
  function del(c,id){delete cache[c][id];lsSet(LSC,cache);emitCol(c);enqueue({op:'del',c:c,id:id});return Promise.resolve();}
  function poll(){
    var at=epoch;
    call('safetyList',{}).then(function(r){
      if(at!==epoch)return;                       // 읽는 사이에 저장이 있었으면 이번 결과는 버리고 다음에 다시 읽는다
      var data=(r&&r.data)||{};canPatch=!!(r&&r.merge);
      window.SAFETY_PHOTO=!!(r&&r.photo);try{localStorage.setItem('safety-photo-ok',window.SAFETY_PHOTO?'1':'0');}catch(e){}
      COLS.forEach(function(c){
        var m=clone(data[c]||{});
        pending.forEach(function(o){if(o.c!==c)return;if(o.op==='set')m[o.id]=clone(o.data);else if(o.op==='patch'){if(m[o.id])Object.keys(o.data).forEach(function(k){m[o.id][k]=o.data[k];});}else delete m[o.id];});
        var s=JSON.stringify(m);
        if(sig[c]!==s){sig[c]=s;cache[c]=m;emitCol(c);}
      });
      lsSet(LSC,cache);polled=true;stale=false;lastOk=Date.now();sync();
    }).catch(function(){
      stale=true;sync();
      if(!polled){
        polled=true;var has=COLS.some(function(c){return Object.keys(cache[c]).length;});
        if(has)COLS.forEach(function(c){sig[c]=JSON.stringify(cache[c]);emitCol(c);});
        else listeners.forEach(function(l){if(l.err)l.err(new Error('offline'));});
      }
    });
  }
  function start(){
    if(started)return;started=true;poll();
    setInterval(function(){if(!document.hidden)poll();},POLL);
    document.addEventListener('visibilitychange',function(){if(!document.hidden){poll();flush();}});
    window.addEventListener('online',function(){poll();flush();});
    window.addEventListener('safety-retry',function(){failed=0;flushing=false;poll();flush();});
    if(pending.length)flush();
  }
  function listen(c,id,cb,err){
    var l={c:c,id:id,cb:cb,err:err};listeners.push(l);start();
    if(polled||Object.keys(cache[c]).length)setTimeout(function(){emit(l);},0);
    return function(){listeners=listeners.filter(function(x){return x!==l;});};
  }
  var db={
    collection:function(c){return {onSnapshot:function(cb,err){return listen(c,null,cb,err);}};},
    doc:function(path){var p=split(path);return {
      set:function(o){return put(p[0],p[1],o);},
      delete:function(){return del(p[0],p[1]);},
      onSnapshot:function(cb,err){return listen(p[0],p[1],cb,err);}
    };}
  };

  /* 파일 저장(엑셀 내려받기) */
  var downloads={save:function(o){
    return new Promise(function(resolve,reject){
      try{
        var blob=(o.data instanceof Blob)?o.data:new Blob([o.data],{type:'application/octet-stream'});
        var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);resolve({status:'saved'});
      }catch(e){reject(e);}
    });
  }};
  window.claude={use:function(name){
    if(name==='db')return login().then(function(){return db;});
    if(name==='downloads')return Promise.resolve(downloads);
    return Promise.resolve(null);
  }};
})();
</script>
<script>
(function(){

var stores=[], settings=Object.assign({},DEFAULT_SETTINGS), loaded=false, db=null, pendingRender=false;

/* ---------- 저장 ---------- */

function saveDoc(s){return dbOp('stores/'+s.id,function(){return db.doc('stores/'+s.id).set(clean(s));});}

function pool(items,fn,n){var i=0;var ws=[];for(var w=0;w<(n||4);w++){ws.push((function(){return (async function(){while(i<items.length){var it=items[i++];await fn(it);}})();})());}return Promise.all(ws);}

/* ---------- 날짜 ---------- */
function today0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function mdList(s){var out=[],re=/(\d{1,2})\s*\/\s*(\d{1,2})/g,m;s=String(s||'');while((m=re.exec(s)))out.push({m:+m[1],d:+m[2]});return out;}
function mdDate(x){return SafetyCore.mdDate(x,new Date());}
function holChips(str){var t=today0();return mdList(str).map(function(x){var d=mdDate(x);var cls='hol'+(d<t?' past':'')+(+d===+t?' today':'');return '<span class="'+cls+'">'+x.m+'/'+x.d+'('+WD[d.getDay()]+')</span>';}).join('');}
function plannedFlag(s){
  if(s.status==='점검완료'||!s.planned)return '';
  var p=mdList(s.planned);if(!p.length)return '';
  var range=/~/.test(s.planned)&&p.length>1;var end=mdDate(p[p.length-1]);
  if(end<today0())return '<span class="flag bad">'+(range?'예정 구간 지남':'예정일 지남')+'</span>';
  if(range)return '';
  var rgp=parseRange(s.group);if(rgp&&!range&&!inRange(mdDate(p[0]),rgp))return '<span class="flag bad">공사 기간 밖</span>';
  var hit=mdList(s.holidays).some(function(x){return x.m===p[0].m&&x.d===p[0].d;});
  return hit?'<span class="flag ok">휴업일에 작업</span>':'<span class="flag warn">영업일 · 점포 협의</span>';
}

/* ---------- 지역, 연락처 ---------- */

function labelOf(line,ph){return String(line).replace(ph,'').replace(/[:\s]+$/,'').replace(/^[:\s]+/,'');}

/* ---------- 필터, 정렬 ---------- */
function matches(s){
  if(ui.status!=='all'&&s.status!==ui.status)return false;
  if(ui.type!=='all'&&s.type!==ui.type)return false;
  if(ui.region!=='all'){var r=region(s.address);if(ui.region.indexOf('S:')===0){if(r.sido!==ui.region.slice(2))return false;}else if((r.sido+' '+r.gu)!==ui.region.slice(2))return false;}
  var q=ui.q.trim().toLowerCase();
  if(q){var hay=(s.name+' '+s.code+' '+s.address+' '+(s.contacts||[]).join(' ')+' '+s.memo).toLowerCase();var digits=q.replace(/[-\s]/g,'');if(hay.indexOf(q)<0&&!(digits&&(s.contacts||[]).join(' ').replace(/[-\s]/g,'').indexOf(digits)>=0))return false;}
  return true;
}
function plannedKey(s){var p=mdList(s.planned);if(!p.length)return 9999;return p[0].m*100+p[0].d;}
function sortList(list){
  var mode=settings.sort||'no';
  var c=list.slice();
  c.sort(function(a,b){
    if(settings.doneLast){var da=a.status==='점검완료'?1:0,db_=b.status==='점검완료'?1:0;if(da!==db_)return da-db_;}
    if(mode==='region'){var ra=region(a.address),rb=region(b.address);return (ra.sido+ra.gu+a.name).localeCompare(rb.sido+rb.gu+b.name,'ko');}
    if(mode==='planned'){return plannedKey(a)-plannedKey(b)||(a.no-b.no);}
    if(mode==='status'){return STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)||(a.no-b.no);}
    return (a.no-b.no);
  });

}

/* ---------- 그리기 ---------- */

var filterSig='';
function renderFilters(){

  stores.forEach(function(s){var r=region(s.address);if(r.sido){sidos[r.sido]=1;if(r.gu)gus[r.sido+' '+r.gu]=1;}if(s.type)types[s.type]=1;});
  var sig=JSON.stringify([Object.keys(sidos),Object.keys(gus),Object.keys(types)]);
  if(sig!==filterSig){

function parseSheet(){

async function applyImport(){

  var list;

    list=stores.map(function(s){return Object.assign({},s);});

      var i=-1;for(var k=0;k<list.length;k++){if((n.code&&list[k].code===n.code)||(!n.code&&list[k].name===n.name)){i=k;break;}}
      if(i>=0){var old=list[i],m=Object.assign({},n,{id:old.id,no:old.no});if(!imp.overwrite){m.status=old.status;m.planned=old.planned;m.memo=old.memo;m.prev=old.prev;}list[i]=m;}

    });

function geoKey(addr){
  var a=String(addr||'').trim().replace(/^경기도/,'경기').replace(/^부산광역시/,'부산').replace(/^(서울|인천|대구|대전|울산)(특별시|광역시)/,'$1');
  for(var i=0;i<GEOK.length;i++){if(a.indexOf(GEOK[i]+' ')===0||a===GEOK[i])return GEOK[i];}
  return '';
}
function geoAll(){
  var sig=stores.map(function(s){return s.id+'|'+s.address;}).join('~');
  if(sig===geoSig)return geoCache;
  var g={},out={};
  stores.slice().sort(function(a,b){return a.no-b.no;}).forEach(function(s){var k=geoKey(s.address);if(k)(g[k]=g[k]||[]).push(s);});
  Object.keys(g).forEach(function(k){
    var arr=g[k],n=arr.length,c=GEO[k];
    arr.forEach(function(s,i){
      if(n===1){out[s.id]=c;return;}
      var ang=Math.PI*2*i/n+0.6,rad=0.009+0.0015*Math.min(n,6);
      out[s.id]=[c[0]+Math.sin(ang)*rad,c[1]+Math.cos(ang)*rad/MC];
    });
  });
  geoSig=sig;geoCache=out;return out;
}

function nearList(n){

function calDay(k){
  var dt=new Date(k),idx=calIndex(dt.getFullYear(),dt.getMonth()),t=+today0(),past=k<t;
  var seen={},cand=[];
  (idx.work[k]||[]).concat(idx.hol[k]||[]).forEach(function(s){if(!seen[s.id]){seen[s.id]=1;cand.push(s);}});
  cand.sort(function(a,b){var ta=timeOf(a.planned),tb=timeOf(b.planned);return (ta==null?9999:ta)-(tb==null?9999:tb)||a.no-b.no;});
  var pp=(idx.proj[k]||[]).filter(function(s){return !seen[s.id];});
  var pr=periodAt(dt);
  var h='<section class="cday" id="cday"><div class="subh"><h2 class="rh" style="margin:0">'+fmtD(dt)+(k===t?' · 오늘':'')+'</h2><button type="button" class="btn sm" data-act="cal-top">달력으로</button></div><p class="note" style="margin:2px 0 0">'+(pr?esc(pr.name)+' 기간':'공사 기간이 아닌 날이에요')+'</p>';
  h+=dayRoute()+othersHTML(dateStr(k))+nearHTML();
  h+='<h3 class="rh" style="margin-top:8px">점포 고르기</h3>'+regionAdd();
  h+='<div class="subh"><span>이 날 작업 예정이거나 쉬는 점포</span><span class="note">'+cand.length+'곳</span></div>';
  h+=cand.length?cand.map(function(s){return crow(s,k,past);}).join(''):'<p class="note" style="margin:0">이 날짜에 인쇄된 휴업일이나 예정일이 있는 점포가 없어요.</p>';
  if(pp.length)h+='<div class="subh"><span>쉴 가능성이 있는 점포 (추정)</span><span class="note">'+pp.length+'곳</span></div><p class="note" style="margin:0">인쇄된 휴업일의 요일을 기준으로 둘째·넷째 주를 계산한 값이에요. 점포에 꼭 확인하세요.</p>'+pp.map(function(s){return crow(s,k,past,true);}).join('');
  return h+'</section>';
}
function calHTML(){
  var c=ui.cal,idx=calIndex(c.y,c.m),t=+today0(),per=periods();
  var first=new Date(c.y,c.m,1),days=new Date(c.y,c.m+1,0).getDate();
  var h='<div class="calh"><button type="button" class="mini" data-act="cal-prev" aria-label="이전 달">‹</button><b>'+c.y+'년 '+(c.m+1)+'월</b><button type="button" class="mini" data-act="cal-next" aria-label="다음 달">›</button><button type="button" class="btn sm" data-act="cal-today">오늘</button></div>';
  h+='<div class="calg">'+WD.map(function(w,i){return '<div class="dow'+(i===0?' sun':'')+'">'+w+'</div>';}).join('');
  for(var i=0;i<first.getDay();i++)h+='<div></div>';
  for(var d=1;d<=days;d++){
    var dt=new Date(c.y,c.m,d),k=+dt,w=idx.work[k]||[],hh=idx.hol[k]||[],pp=idx.proj[k]||[],rr=idx.route[k]||[],inP=periodAt(dt,per);
    h+='<button type="button" class="day'+(k===t?' today':'')+(k===c.sel?' sel':'')+(inP?' inp':'')+(dt.getDay()===0?' sun':'')+'" data-act="cal-sel" data-k="'+k+'" aria-pressed="'+(k===c.sel)+'" aria-label="'+(c.m+1)+'월 '+d+'일'+(w.length?', 작업 '+w.length+'곳':'')+(hh.length?', 휴업 '+hh.length+'곳':'')+(pp.length?', 추정 '+pp.length+'곳':'')+'"><span class="dn">'+d+(rr.length?'<i class="rd" title="동선"></i>':'')+'</span>'+
     (w.length?'<span class="cw">'+w.length+'</span>':'')+(hh.length?'<span class="ch">'+hh.length+'</span>':'')+(pp.length?'<span class="cp">'+pp.length+'</span>':'')+'</button>';
  }
  h+='</div><p class="legend"><span><b class="lg cw">작업</b>예상 작업일</span><span><b class="lg ch">휴</b>쉬는 점포</span><span><b class="lg cp">추정</b>둘째·넷째 규칙</span><span><i class="rd"></i>저장한 동선</span><span><i class="bar2"></i>공사 기간</span></p>';
  return h+calDay(c.sel);

/* ---------- 오늘 (현장 첫 화면): 오늘 동선을 순서대로, 전화/지도/결선도/완료를 한 번에 ---------- */
function todayRoute(){return routeOf(dateStr(+today0()),me());}

  var t=today0(),r=todayRoute(),ids=r?(r.stops||[]).filter(find):[];

  /* 다음 점포 하나는 크게(전화·지도·결선도 + 큰 점검완료), 나머지는 한 줄. 줄을 누르면 그 점포의 버튼이 펼쳐진다. */
  function acts(s,id,fin,big){

     '<a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+q+'">지도</a>'+
     '<button type="button" class="btn" data-act="wopen" data-id="'+id+'">결선도</button>'+
     '<button type="button" class="btn tdone'+(fin?'':' primary')+'" data-act="check" data-id="'+id+'">'+(fin?'완료 취소':'점검완료')+'</button></div>';
  }
  sch.forEach(function(x,i){
    var s=x.s,id=esc(s.id),g=region(s.address),fin=s.status==='점검완료',open=ui.open===s.id,isNext=(i===next);
    var tm='<div class="tr-tm">'+fmtT(x.a)+'<small>'+esc(g.gu||g.sido)+'</small></div>';
    var dot='<div class="tr-rail"><i class="tr-dot'+(s.id===lastDone?' fresh':'')+'"></i></div>';
    if(isNext){
      h+='<li class="tr next" data-id="'+id+'">'+tm+dot+'<div class="tr-body"><b class="nm">'+esc(s.name)+'</b><span class="tr-meta">다음 · '+esc(s.status)+(x.trav?' · 이동 약 '+x.trav+'분':'')+' · '+fmtT(x.e)+'까지</span>'+
       acts(s,id,fin,true)+
       '<button type="button" class="more" data-act="toggle" data-id="'+id+'" aria-expanded="'+open+'">'+(open?'접기':'자세히 보기')+'</button>'+(open?detailHTML(s):'')+'</div></li>';
    }else{
      h+='<li class="tr '+(fin?'done':'todo')+'" data-id="'+id+'">'+tm+dot+'<div class="tr-body"><button type="button" class="tr-head" data-act="toggle" data-id="'+id+'" aria-expanded="'+open+'"><b class="nm">'+esc(s.name)+'</b><small>'+(fin?'점검완료':esc(s.status))+(x.trav?' · 이동 '+x.trav+'분':'')+'</small></button>'+
       (open?'<div class="topen">'+acts(s,id,fin,false)+detailHTML(s)+'</div>':'')+'</div></li>';

function openPhoto(id){

document.addEventListener('change',function(e){

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  switch(a){
    case 'toggle':ui.open=(ui.open===id)?null:id;render(true);if(ui.open){var el=document.querySelector('[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"].card');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});}break;
    case 'check':toggleDone(id);break;
    case 'view':ui.view=b.getAttribute('data-v');try{localStorage.setItem('anjeon-view',ui.view);}catch(e){}render(true);window.scrollTo(0,0);break;
    case 'sec':(function(){var k=b.getAttribute('data-k'),open=(b.getAttribute('aria-expanded')!=='true');ui.sec[k]=open;render(true);
      if(open&&ui.view==='region'){var sd=k.slice(7),pos=geoAll(),pts=[];stores.forEach(function(s){if(pos[s.id]&&region(s.address).sido===sd)pts.push(proj(pos[s.id]));});if(pts.length){fitPts(pts);drawMap();}}})();break;
    case 'radd':toggleStop(id);break;
    case 'pview-open':openPhoto(id);break;
    case 'pview-close':closePhoto();break;
    case 'pview-zoom':(function(){var el=$('pview'),on=el.classList.toggle('full');b.textContent=on?'작게 보기':'크게 보기';})();break;
    case 'pview-del':confirmAct(b,delPhoto);break;
    case 'wopen':wid=id;renderW();$('wsheet').hidden=false;document.body.style.overflow='hidden';break;
    case 'wclose':wFlush();$('wsheet').hidden=true;document.body.style.overflow='';wid=null;render(true);break;
    case 'wprint':(function(){wFlush();var s=find(wid);if(!s)return;$('printsheet').innerHTML=printHTML(s,sheetOf(wid));window.print();})();break;
    case 'wset':(function(){var r=wEnsure().rows[+b.getAttribute('data-i')],k=b.getAttribute('data-k'),v=b.getAttribute('data-v');if(!r)return;r[k]=(String(r[k])===v)?'':v;wSave();renderW();})();break;
    case 'wadd':(function(){wEnsure().rows.push({name:'',type:'',p:'',at:'',af:'',sq:'',l1:'',l2:'',l3:''});wSave();renderW();var rows=$('wsheet').querySelectorAll('.wrow'),last=rows[rows.length-1];if(last){var sh2=$('wsheet');sh2.scrollTop+=last.getBoundingClientRect().top-64;last.querySelector('[data-wr=name]').focus({preventScroll:true});}})();break;
    case 'wdel':confirmAct(b,function(){var sh=wEnsure();sh.rows.splice(+id,1);wSave();renderW();});break;
    case 'near-add':nearAdd();break;
    case 'openstore':ui.q='';ui.status='all';ui.region='all';ui.type='all';$('q').value='';ui.open=id;ui.view='list';try{localStorage.setItem('anjeon-view','list');}catch(e){}render(true);(function(){var el=document.querySelector('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});})();break;
    case 'mapmove':ui.mapMove=!ui.mapMove;b.setAttribute('aria-pressed',String(!!ui.mapMove));b.textContent='✋ 손가락으로 지도 움직이기 '+(ui.mapMove?'켜짐':'꺼짐');$('mapsvg').classList.toggle('mv',!!ui.mapMove);toast(ui.mapMove?'지도를 손가락으로 움직여요. 화면 스크롤은 지도 밖에서 하세요.':'지도 위에서도 화면이 스크롤돼요.');break;
    case 'zoom':if(mv){var cc={x:mv.x+mv.w/2,y:mv.y+mv.h/2};zoomAt(cc.x,cc.y,b.getAttribute('data-v')==='in'?1/1.6:1.6);drawMap();}break;
    case 'fit':(function(){var v=b.getAttribute('data-v'),pos=geoAll(),pts=[];
      stores.forEach(function(s){if(!pos[s.id])return;var ok=false;if(v==='all')ok=true;else if(v==='vis')ok=!!mapVis[s.id];else if(v==='route')ok=inRoute(s.id);else ok=FITS[v].indexOf(region(s.address).sido)>=0;if(ok)pts.push(proj(pos[s.id]));});
      fitPts(pts);drawMap();})();break;
    case 'rup':case 'rdown':moveStop(id,a==='rup'?-1:1);break;
    case 'radd-region':addRegion(ui.rsel);break;
    case 'radd-gu':addRegion(b.getAttribute('data-k'));break;
    case 'rnear':sortStopsNear();break;
    case 'rcopy':copyText(routeText());break;
    case 'rclear':confirmAct(b,function(){ui.draft.stops=[];saveDraft();render(true);});break;
    case 'cal-prev':case 'cal-next':(function(){var c=ui.cal,m=c.m+(a==='cal-next'?1:-1);c.y+=Math.floor(m/12);c.m=((m%12)+12)%12;render(true);})();break;
    case 'cal-today':goToday(false);break;
    case 'today-make':goToday(true);break;
    case 'cal-sel':selectDate(+b.getAttribute('data-k'));render(true);(function(){var el=$('cday');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});})();break;
    case 'cal-top':window.scrollTo({top:0,behavior:'smooth'});break;
    case 'setday':setDay(id,+b.getAttribute('data-k'));break;
    case 'status':setStatus(id,b.getAttribute('data-v'));break;
    case 'toast-undo':runUndo();break;
    case 'copy':copyText(b.getAttribute('data-t'));break;
    case 'sms':sendSms(id,b.getAttribute('data-t'));break;
    case 'chip':ui.status=(ui.status===b.getAttribute('data-v'))?'all':b.getAttribute('data-v');render(true);break;
    case 'clear-filters':ui.q='';ui.status='all';ui.region='all';ui.type='all';$('q').value='';render(true);break;
    case 'retry':window.dispatchEvent(new CustomEvent('safety-retry'));toast('다시 불러오고 있어요');break;
    case 'open-sheet':renderSheet();$('sheet').hidden=false;document.body.style.overflow='hidden';break;
    case 'close-sheet':$('sheet').hidden=true;document.body.style.overflow='';ui.imp=null;break;
    case 'export-xlsx':exportXlsx();break;
    case 'export-copy':exportCopy();break;
    case 'import-go':applyImport();break;
    case 'import-cancel':ui.imp=null;renderSheet();break;
    case 'reset-progress':confirmAct(b,resetProgress);break;
    case 'wipe':confirmAct(b,function(){replaceAll([],true).then(function(){toast('모든 점포를 지웠어요');});});break;
  }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key!=='Enter'||!wid||t.tagName!=='INPUT'||!$('wsheet').contains(t))return;
  e.preventDefault();
  var all=[].slice.call($('wsheet').querySelectorAll('input[type=text]')),n=all[all.indexOf(t)+1];
  if(n)n.focus();else{var a=$('wsheet').querySelector('[data-act=wadd]');if(a)a.click();}
});
document.addEventListener('input',function(e){
  var t=e.target,k;if(!wid)return;
  if((k=t.getAttribute('data-wf'))){wEnsure()[k]=t.value;wSave();return;}
  if((k=t.getAttribute('data-wr'))&&t.tagName==='INPUT'){var r=wEnsure().rows[+t.getAttribute('data-i')];if(r){r[k]=t.value;wSave();}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='file'){if(t.files&&t.files[0])readFile(t.files[0]);t.value='';return;}
  if(t.getAttribute('data-rf')){var rf=t.getAttribute('data-rf');ui.draft[rf]=(rf==='work')?(parseInt(t.value,10)||60):t.value;saveDraft();render(true);return;}
  if(t.id==='rSel'){ui.rsel=t.value;return;}
  if(t.getAttribute('data-f')){updateStore(t.getAttribute('data-id'),(function(){var o={};o[t.getAttribute('data-f')]=t.value;return o;})());return;}
  if(t.id==='fRegion'){ui.region=t.value;render(true);return;}
  if(t.id==='fType'){ui.type=t.value;render(true);return;}
  if(t.id==='fSort'){settings.sort=t.value;persistSettings();render(true);return;}
  if(t.id==='setTitle'){settings.title=t.value.trim()||DEFAULT_SETTINGS.title;persistSettings();return;}
  if(t.name==='fs'){settings.font=t.value;persistSettings();return;}
  if(t.id==='setDone'){settings.doneLast=t.checked;persistSettings();render(true);return;}
  if(t.id==='impSheet'){ui.imp.sheet=t.value;parseSheet();renderSheet();return;}
  if(t.getAttribute('data-imp')){ui.imp.map[t.getAttribute('data-imp')]=parseInt(t.value,10);reparse();renderSheet();return;}
  if(t.name==='impMode'){ui.imp.mode=t.value;renderSheet();return;}
  if(t.id==='impOver'){ui.imp.overwrite=t.checked;return;}
});
$('q').addEventListener('input',function(e){ui.q=e.target.value;render(true);});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!typing())render(true);},0);});

/* ---------- 위쪽 띠: 아래로 내리면 검색창을 접고, 올리면 다시 보여줌 ---------- */
(function(){
  var root=document.documentElement,top=$('topbar'),last=0;
  function measure(){root.style.setProperty('--toph',top.offsetHeight+'px');}
  measureTop=measure;measure();window.addEventListener('resize',measure);
  if(window.ResizeObserver)new ResizeObserver(measure).observe(top);
  window.addEventListener('load',measure);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  window.addEventListener('scroll',function(){
    var y=window.pageYOffset,dy=y-last;
    if(y<80||document.activeElement===$('q')){root.classList.remove('sub-hide');last=y;return;}
    if(dy>8){root.classList.add('sub-hide');last=y;}else if(dy<-8){root.classList.remove('sub-hide');last=y;}
  },{passive:true});
  document.addEventListener('click',function(e){if(e.target.closest('#tabs button'))root.classList.remove('sub-hide');});
})();

/* ---------- 저장 대기 표시 (오프라인이면 쌓였다가 연결되면 자동 저장) ---------- */
var photoFlag=null;
window.addEventListener('safety-sync',function(e){
  var d=e.detail,el=$('syncst');if(!el)return;
  if(photoFlag!==SafetyPhoto.enabled()){photoFlag=SafetyPhoto.enabled();if(wid&&!$('wsheet').hidden&&!$('wsheet').contains(document.activeElement))renderW();}
  var t='';
  if(d.pending&&d.failed)t='저장 안 됨 '+d.pending+'건 · 눌러서 다시';
  else if(d.pending)t='저장 대기 '+d.pending+'건';
  else if(d.stale){var h=d.last?new Date(d.last):null;t='연결 안 됨'+(h?' · '+h.getHours()+':'+('0'+h.getMinutes()).slice(-2)+' 기준':'')+' · 눌러서 다시';}
  el.hidden=!t;el.textContent=t;
});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='syncst')window.dispatchEvent(new CustomEvent('safety-retry'));});

/* ---------- 시작 ---------- */
async function init(){
  ui.view='today';
  (function(){var n=window.TITAN_USER||localStorage.getItem('titan_user_name')||'';if(n)$('whoami').textContent=n+' 님';})();
  loadDraft();applySettings();render(true);
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
  if(window.TITAN_USER)$('whoami').textContent=window.TITAN_USER+' 님';
  if(db){
    db.collection('stores').onSnapshot(function(snap){
      stores=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
      loaded=true;render();
    },function(){loaded=true;toast('저장소에 연결하지 못했어요.');render(true);});
    db.collection('routes').onSnapshot(function(snap){routes=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});selectDate(ui.cal.sel);render();},function(){});
    db.collection('photos').onSnapshot(function(snap){
      photos={};snap.docs.forEach(function(d){photos[d.id]=d.data();});
      if(wid&&!$('wsheet').hidden&&!$('wsheet').contains(document.activeElement))renderW();
    },function(){});
    SafetyPhoto.init({db:db,who:me,photos:function(){return photos;},onChange:function(){if(wid&&!$('wsheet').hidden&&!$('wsheet').contains(document.activeElement))renderW();}});
    db.collection('sheets').onSnapshot(function(snap){
      sheets={};snap.docs.forEach(function(d){sheets[d.id]=Object.assign({},d.data(),{id:d.id});});
      if(wid&&!$('wsheet').hidden&&!$('wsheet').contains(document.activeElement))renderW();
      render();
    },function(){});
    db.doc('config/app').onSnapshot(function(snap){
      if(snap.exists){settings=Object.assign({},DEFAULT_SETTINGS,snap.data());applySettings();render();}
    },function(){});
  }else{
    try{sheets=JSON.parse(localStorage.getItem(SHEETS_LS)||'{}')||{};}catch(e){sheets={};}
    rsLoad();selectDate(ui.cal.sel);if(!lsLoad())stores=defaultStores();
    loaded=true;applySettings();render(true);
  }
}
init();
})();
