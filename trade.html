<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거래처·현장</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="pc.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 12px; padding: 20px 32px 16px; flex-wrap: wrap; }
  .top h2 { margin: 0 12px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .top .sp { flex: 1; }
  #q { width: 260px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; min-height: 34px; padding: 0 14px; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; gap: 20px; padding: 0 32px 24px; }
  .pane { min-height: 0; overflow: auto; }
  .side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
  .side button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--r); background: none; color: var(--text); font-size: 13.5px; text-align: left; cursor: pointer; }
  .side button:hover { background: var(--bg); }
  .side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .side button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .c { color: var(--text-sub); font-size: 12px; font-variant-numeric: tabular-nums; }
  .notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 14px; border: 1px solid #f0d9b5; border-radius: var(--r); background: var(--warn-soft); font-size: 13px; }
  .notice .it { display: inline-flex; align-items: center; gap: 8px; }
  #tbl tbody tr { cursor: pointer; }
  #tbl tbody tr.sel td { background: var(--accent-soft); }
  #tbl td.sub { color: var(--text-sub); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dd.late { color: var(--danger); font-weight: 700; }
  .badge.done { background: #eceef2; color: var(--text-sub); }
  .badge.run { background: var(--ok-soft); color: var(--ok); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
  .panel h3 { margin: 0 0 4px; font-size: 16px; }
  .panel .who { margin: 0 0 16px; color: var(--text-sub); font-size: 13px; }
  .f { margin-bottom: 12px; }
  .f input, .f select, .f textarea { width: 100%; }
  .f textarea { min-height: 64px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts .btn-primary { flex: 1; }
  .log { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
  .log h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-sub); }
  .log .r { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .log .r:last-child { border-bottom: 0; }
  .log .d, .log .w { color: var(--text-sub); }
  .log { max-height: 280px; overflow: auto; }
  #msg { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: var(--text-sub); }
  #msg.err { color: var(--danger); }
  #msg.ok { color: var(--ok); }
</style>
</head>
<body>
<div class="top">
  <h2>거래처·현장</h2>
  <div class="seg" id="seg"><button data-s="run" class="on">진행중</button><button data-s="done">완료</button><button data-s="all">전체</button></div>
  <input id="q" type="search" placeholder="현장·주소 검색" aria-label="현장·주소 검색">
  <span class="sp"></span>
  <button class="btn btn-primary" id="newBtn">새 현장 등록</button>
</div>
<div class="cols">
  <nav class="pane side" id="clients" aria-label="거래처"></nav>
  <section class="pane">
    <div id="unreg"></div>
    <table class="tbl" id="tbl"><thead><tr><th>현장</th><th>거래처</th><th>주소</th><th>마감</th><th>상태</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">불러오는 중</td></tr></tbody></table>
  </section>
  <aside class="pane"><div class="panel" id="panel"></div></aside>
</div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CK = 'titan_clients'; // 관리자 화면과 같은 저장 키: 열자마자 지난번 값을 먼저 보여준다
let data = {}, client = '', status = 'run', sel = null, creating = false;

function load() {
  try { const c = localStorage.getItem(CK); if (c) { data = JSON.parse(c); draw(); } } catch (e) {}
  return sendToGas('getTitanData', {}).then(r => {
    const d = r.titanData || r.result || r;
    ['message', 'status', 'result', 'undefined'].forEach(k => delete d[k]);
    data = d;
    try { localStorage.setItem(CK, JSON.stringify(d)); } catch (e) {}
    if (sel && !(data[sel.c] || []).some(s => s.name === sel.s)) sel = null;
    draw();
  }).catch(e => { if (!Object.keys(data).length) $('rows').innerHTML = '<tr><td colspan="5" class="empty err">불러오지 못했습니다. ' + esc(e.message) + '</td></tr>'; });
}
const sites = c => Array.isArray(data[c]) ? data[c] : [];
const ymd = v => { const m = String(v || '').match(/^\d{4}-\d{2}-\d{2}/); if (m) return m[0]; const d = new Date(v); return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const pass = s => status === 'all' || (status === 'done') === (s.status === '완료');
function dday(s) {
  const d = ymd(s.deadline); if (!d) return '';
  const t = new Date(); const diff = Math.round((new Date(d) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
  const late = s.status !== '완료' && diff < 0;
  return `<span class="dd${late ? ' late' : ''}">${d.slice(5)} (${diff > 0 ? 'D-' + diff : diff === 0 ? 'D-DAY' : 'D+' + -diff})</span>`;
}

function draw() {
  const names = Object.keys(data);
  const cnt = c => sites(c).filter(pass).length;
  $('clients').innerHTML = `<button data-c="" class="${client === '' ? 'on' : ''}"><span>전체</span><span class="c">${names.reduce((n, c) => n + cnt(c), 0)}</span></button>`
    + names.filter(c => cnt(c) || c === client).map(c => `<button data-c="${esc(c)}" class="${client === c ? 'on' : ''}"><span>${esc(c)}</span><span class="c">${cnt(c)}</span></button>`).join('');
  const t = $('q').value.trim().toLowerCase();
  const list = [];
  names.forEach(c => { if (client && client !== c) return; sites(c).forEach(s => { if (pass(s) && (!t || (s.name + ' ' + (s.addr || '')).toLowerCase().includes(t))) list.push({ c, s }); }); });
  $('rows').innerHTML = list.length ? list.map(({ c, s }) => `<tr data-c="${esc(c)}" data-s="${esc(s.name)}" class="${sel && sel.c === c && sel.s === s.name ? 'sel' : ''}">
      <td><b>${esc(s.name)}</b></td><td>${esc(c)}</td><td class="sub" title="${esc(s.addr)}">${esc(s.addr || '')}</td><td>${dday(s)}</td>
      <td><span class="badge ${s.status === '완료' ? 'done' : 'run'}">${s.status === '완료' ? '완료' : '진행중'}</span></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">조건에 맞는 현장이 없습니다.</td></tr>';
  panel();
}

// ---- 오른쪽 패널: 새 현장 등록 / 선택한 현장 수정 ----
function panel() {
  const p = $('panel');
  if (creating || !sel) {
    if (!creating && !sel) { p.innerHTML = '<p class="msg" style="margin:0">왼쪽 표에서 현장을 고르면 여기서 수정할 수 있습니다.</p>'; return; }
    p.innerHTML = `<h3>새 현장 등록</h3><p class="who">거래처는 목록에서 고르거나 새로 입력합니다.</p>
      <div class="f"><label class="lb" for="nc">거래처</label><input id="nc" list="cl" value="${esc(client)}"><datalist id="cl">${Object.keys(data).map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div class="f"><label class="lb" for="ns">현장명</label><input id="ns"></div>
      <div class="f"><label class="lb" for="na">주소</label><input id="na"></div>
      <div class="f"><label class="lb" for="nn">현장 특이사항</label><textarea id="nn" placeholder="비밀번호, 주차 안내 등"></textarea></div>
      <div class="f"><label class="lb" for="nd">마감예정일</label><input id="nd" type="date"></div>
      <div class="acts"><button class="btn btn-primary" id="addGo">등록</button><button class="btn" id="addX">취소</button></div><div id="msg"></div>`;
    $('addGo').onclick = add; $('addX').onclick = () => { creating = false; draw(); };
    return;
  }
  const s = sites(sel.c).find(x => x.name === sel.s); if (!s) { sel = null; return panel(); }
  p.innerHTML = `<h3>${esc(s.name)}</h3><p class="who">${esc(sel.c)}</p>
    <div class="row2"><div class="f"><label class="lb" for="es">상태</label><select id="es"><option>진행중</option><option>완료</option></select></div>
    <div class="f"><label class="lb" for="ed">마감예정일</label><input id="ed" type="date" value="${esc(ymd(s.deadline))}"></div></div>
    <div class="f"><label class="lb" for="ea">주소</label><input id="ea" value="${esc(s.addr || '')}"></div>
    <div class="f"><label class="lb" for="en">현장 특이사항</label><textarea id="en">${esc(s.note || '')}</textarea></div>
    <div class="acts"><button class="btn btn-primary" id="saveGo">저장</button></div><div id="msg"></div>
    <div class="log" id="log"><h4>작업 기록</h4><p class="msg" style="margin:0">불러오는 중</p></div>`;
  $('es').value = s.status === '완료' ? '완료' : '진행중';
  $('saveGo').onclick = save;
  const key = sel.c + '|' + sel.s;
  sendToGas('getSiteProcessStatus', { client: sel.c, site: sel.s }).then(r => {
    if (!sel || sel.c + '|' + sel.s !== key || !$('log')) return;
    const logs = r.logs || [];
    $('log').innerHTML = '<h4>작업 기록 ' + (r.totalLogCount || logs.length) + '건</h4>' + (logs.length
      ? logs.map(l => `<div class="r"><span class="d">${esc(l.date)}</span><span>${esc(l.work || '-')}</span><span class="w">${esc(l.workers || '')}</span></div>`).join('')
      : '<p class="msg" style="margin:0">아직 작업 기록이 없습니다.</p>');
  }).catch(() => { if ($('log')) $('log').innerHTML = '<h4>작업 기록</h4><p class="err">불러오지 못했습니다.</p>'; });
}

const say = (t, k) => { const m = $('msg'); if (m) { m.textContent = t; m.className = k || ''; } };
const okRes = r => !(r && (r.status === 'ERROR' || r.res === 'ERROR')) && !/ERROR|실패/.test(typeof r === 'string' ? r : '');

async function save() {
  const b = $('saveGo'); b.disabled = true; say('저장 중');
  try {
    const r = await sendToGas('updateClientInfoFull', { client: sel.c, site: sel.s, address: $('ea').value.trim(), note: $('en').value.trim(), status: $('es').value, deadline: $('ed').value });
    if (!okRes(r)) throw new Error(typeof r === 'string' ? r : (r.message || '저장 실패'));
    await load(); say('저장했습니다.', 'ok');
  } catch (e) { say('저장 실패: ' + e.message, 'err'); b.disabled = false; }
}
async function add() {
  const c = $('nc').value.trim(), s = $('ns').value.trim();
  if (!c || !s) { say('거래처와 현장명을 입력해 주세요.', 'err'); return; }
  const b = $('addGo'); b.disabled = true; say('등록 중');
  try {
    const r = await sendToGas('adminAddClient', { client: c, site: s, address: $('na').value.trim(), note: $('nn').value.trim(), deadline: $('nd').value });
    if (!okRes(r)) throw new Error(typeof r === 'string' ? r : (r.message || '등록 실패'));
    creating = false; sel = { c, s }; status = 'all'; client = c;
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x.dataset.s === 'all'));
    await load();
  } catch (e) { say('등록 실패: ' + e.message, 'err'); b.disabled = false; }
}

// ---- 직원이 일보에 직접 입력한 미등록 현장 ----
function unreg() {
  sendToGas('getUnregisteredSites', {}).then(list => {
    if (!Array.isArray(list) || !list.length) { $('unreg').innerHTML = ''; return; }
    $('unreg').innerHTML = `<div class="notice"><b>미등록 현장 ${list.length}건</b><span>직원이 일보에 직접 입력한 현장입니다. 맞으면 등록하세요.</span>`
      + list.map(u => `<span class="it">${esc(u.client)} / ${esc(u.site)} (${u.count}회)<button class="btn btn-sm" data-uc="${esc(u.client)}" data-us="${esc(u.site)}">등록</button></span>`).join('') + '</div>';
  }).catch(() => {});
}
$('unreg').onclick = async e => {
  const b = e.target.closest('button[data-uc]'); if (!b) return;
  b.disabled = true; b.textContent = '등록 중';
  try { const r = await sendToGas('adminAddClient', { client: b.dataset.uc, site: b.dataset.us, address: '', note: '', deadline: '' }); if (!okRes(r)) throw 0; await load(); unreg(); }
  catch (_) { b.disabled = false; b.textContent = '다시 시도'; }
};

$('clients').onclick = e => { const b = e.target.closest('button'); if (b) { client = b.dataset.c; draw(); } };
$('rows').onclick = e => { const tr = e.target.closest('tr[data-s]'); if (tr) { creating = false; sel = { c: tr.dataset.c, s: tr.dataset.s }; draw(); } };
$('seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; status = b.dataset.s; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('q').oninput = draw;
$('newBtn').onclick = () => { creating = true; sel = null; draw(); };
load().then(unreg);
</script>
</body>
</html>
